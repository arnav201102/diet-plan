<style>
:root{
  --paper:#f6f3ea; --card:#fffdf6; --ink:#17251d; --soft:#5f6d63;
  --brand:#2f5d45; --marigold:#d9911a; --chili:#b03a26;
  --rule:#ddd6c3; --rail:#cfc6b1; --tick:#ffffff;
  --band:#22493a; --band-ink:#eef5ef; --band-soft:#9dbfac;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111713; --card:#1a221d; --ink:#e9e5d8; --soft:#95a398;
    --brand:#7cbb99; --marigold:#eeb14a; --chili:#e0715c;
    --rule:#29332d; --rail:#38443d; --tick:#111713;
    --band:#17231c; --band-ink:#e9e5d8; --band-soft:#7f9488;
  }
}
:root[data-theme="dark"]{
  --paper:#111713; --card:#1a221d; --ink:#e9e5d8; --soft:#95a398;
  --brand:#7cbb99; --marigold:#eeb14a; --chili:#e0715c;
  --rule:#29332d; --rail:#38443d; --tick:#111713;
  --band:#17231c; --band-ink:#e9e5d8; --band-soft:#7f9488;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:0 16px 132px}

/* ---- band ---- */
.band{background:var(--band);color:var(--band-ink)}
.band-in{max-width:560px;margin:0 auto;padding:18px 16px 16px;
  display:flex;gap:14px;align-items:center}
.band h1{
  font-family:"Fraunces",Georgia,serif;font-optical-sizing:auto;
  font-weight:600;font-size:30px;line-height:1;margin:0 0 3px;letter-spacing:-.01em}
.band .sub{font-size:13px;color:var(--band-soft);margin:0}
.band .grow{flex:1;min-width:0}
.ring{flex:none;position:relative;width:54px;height:54px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- all-day strip ---- */
.strip{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:12px 14px;margin:14px 0 6px}
.strip .row{display:flex;gap:12px;align-items:flex-start}
.strip h2{font-size:15px;font-weight:700;margin:0 0 2px}
.strip p{margin:0;font-size:13px;color:var(--soft)}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--rule)}
.pip{width:22px;height:26px;border:1.5px solid var(--rail);border-radius:3px 3px 7px 7px;
  background:transparent;transition:background .15s,border-color .15s}
.pip.on{background:var(--brand);border-color:var(--brand)}
.waterline{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:var(--soft);margin-top:10px}
.waterline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- timeline ---- */
.rail{list-style:none;margin:8px 0 0;padding:0;position:relative}
.slot{position:relative;padding:0 0 4px 40px;min-height:56px}
.slot::before{content:"";position:absolute;left:12px;top:24px;bottom:-4px;
  width:1.5px;background:var(--rail)}
.slot:last-child::before{display:none}
.dot{position:absolute;left:5px;top:12px;width:16px;height:16px;border-radius:50%;
  border:1.5px solid var(--rail);background:var(--paper);
  display:grid;place-items:center;z-index:1;transition:background .15s,border-color .15s}
.dot svg{width:10px;height:10px;opacity:0;transition:opacity .15s}
.slot.done .dot{background:var(--brand);border-color:var(--brand)}
.slot.done .dot svg{opacity:1;stroke:var(--tick)}
.slot.skip .dot{border-color:var(--rail);background:var(--rail)}
.slot.skip .dot::after{content:"";width:8px;height:1.5px;background:var(--paper)}
.tap{display:block;width:100%;text-align:left;padding:8px 0 10px;
  border-bottom:1px solid var(--rule)}
.slot:last-child .tap{border-bottom:0}
.when{font-size:12px;letter-spacing:.02em;color:var(--soft);
  font-variant-numeric:tabular-nums;margin-bottom:1px}
.what{font-size:16px;font-weight:600;line-height:1.3}
.slot.done .what,.slot.skip .what{color:var(--soft);font-weight:500}
.slot.done .what{text-decoration:line-through;text-decoration-color:var(--rail)}
.slot.late .when{color:var(--chili);font-weight:700}
.hitdot{position:absolute;left:-6px;top:2px;width:38px;height:38px;z-index:2}

.more{display:none;padding:2px 0 12px}
.slot.open .more{display:block}
.more p{margin:0 0 10px;font-size:14px;color:var(--soft);max-width:60ch}
.more .flag{color:var(--chili)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--rule);border-radius:999px;padding:5px 13px;
  font-size:13px;font-weight:600;color:var(--soft)}
.chip.on{border-color:var(--brand);background:var(--brand);color:var(--tick)}
.acts{display:flex;gap:8px}
.act{border:1.5px solid var(--rule);border-radius:8px;padding:7px 14px;
  font-size:13px;font-weight:700}
.act.solid{background:var(--brand);border-color:var(--brand);color:var(--tick)}

.nowline{display:flex;align-items:center;gap:10px;margin:2px 0 2px 40px;
  font-size:12px;font-weight:700;color:var(--marigold)}
.nowline::after{content:"";flex:1;height:1.5px;background:var(--marigold);opacity:.45}

/* ---- generic card ---- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:14px 16px;margin:12px 0}
.card h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;
  margin:0 0 8px;letter-spacing:-.01em}
.card h3{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--brand)}
.card h3:first-child{margin-top:0}
.card p{margin:0 0 10px;font-size:14px;color:var(--soft);max-width:62ch}
.card p:last-child{margin-bottom:0}
.sechead{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:22px;
  margin:22px 0 2px;letter-spacing:-.01em}
.sechead+.lede{margin:0 0 4px;font-size:13px;color:var(--soft)}

.checks{list-style:none;margin:0;padding:0}
.checks li{border-bottom:1px solid var(--rule)}
.checks li:last-child{border-bottom:0}
.checks button{display:flex;gap:11px;width:100%;text-align:left;
  padding:10px 0;align-items:flex-start;font-size:14.5px;line-height:1.35}
.box{flex:none;width:17px;height:17px;margin-top:2px;border:1.5px solid var(--rail);
  border-radius:4px;display:grid;place-items:center}
.box svg{width:11px;height:11px;opacity:0;stroke:var(--tick)}
.checks .on .box{background:var(--brand);border-color:var(--brand)}
.checks .on .box svg{opacity:1}
.checks .on span{color:var(--soft);text-decoration:line-through;
  text-decoration-color:var(--rail)}

/* ---- week grid ---- */
.daypick{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daypick::-webkit-scrollbar{display:none}
.daypick button{flex:none;border:1.5px solid var(--rule);border-radius:9px;
  padding:7px 13px;font-size:13px;font-weight:700;color:var(--soft)}
.daypick button.on{background:var(--brand);border-color:var(--brand);color:var(--tick)}
.daypick button.today{border-color:var(--marigold)}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);
  font-size:14.5px;line-height:1.35}
.mini li:last-child{border-bottom:0}
.mini .t{flex:none;width:62px;font-size:12px;color:var(--soft);
  font-variant-numeric:tabular-nums;padding-top:2px}
.mini .n{font-size:11px;color:var(--soft);display:block;margin-top:2px}

/* ---- streak ---- */
.streak{display:flex;gap:8px;align-items:center;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--rule)}
.sdots{display:flex;gap:5px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--rail)}
.sdot.on{background:var(--brand)}
.sdot.half{background:var(--marigold)}
.streak span{font-size:13px;color:var(--soft)}

.portions{width:100%;border-collapse:collapse;font-size:14px}
.portions td{padding:7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.portions td:first-child{font-weight:700;width:44%;padding-right:12px}
.portions tr:last-child td{border-bottom:0}

/* ---- tabs ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--rule);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;color:var(--soft)}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--brand)}
.ghost{font-size:13px;color:var(--soft);text-align:center;padding:14px 0 0}
</style>
</head>

/* ---------------------------------------------------------------- state */
const LS = "dietplan.v1";
let S = { days:{}, shop:{ week:"", checked:[] }, prefs:{
  bhurji:"paneer", thuBreakfast:"smoothie", lunchCereal:"chapati" } };
let viewDay = null, tab = "today";
const open = new Set();

function lsGet(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

function save(){ prune(); lsSet(); }
function prune(){
  const keys = Object.keys(S.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
  while(keys.length > 70) delete S.days[keys.shift()];
}

/* ---------------------------------------------------------------- dates */
const KEY = ["sun","mon","tue","wed","thu","fri","sat"];
function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return new Date(); }
function todayKey(){ return dateKey(today()); }
function dayId(d){ return KEY[d.getDay()]; }
function rec(k){
  if(!S.days[k]) S.days[k] = { done:[], skip:[], water:0 };
  const r = S.days[k];
  r.done = r.done||[]; r.skip = r.skip||[]; r.water = r.water||0;
  return r;
}
function fmtTime(hhmm){
  let [h,m] = hhmm.split(":").map(Number);
  const ap = h>=12 ? "pm" : "am"; h = h%12 || 12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}
function mins(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+"-W"+String(Math.ceil(((t-y0)/86400000+1)/7)).padStart(2,"0");
}

/* resolve a slot for a day, applying the saved choice */
function label(slot){
  if(slot.choice && slot.options){
    const pick = S.prefs[slot.choice];
    if(slot.options[pick]) return slot.options[pick];
  }
  return slot.item;
}
function slotsFor(dayid){ return PLAN.days[dayid].slots; }

/* ---------------------------------------------------------------- icons */
const ICON = {
  check:'<svg viewBox="0 0 12 12" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.6 9 10 3"/></svg>',
  today:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3.5 2"/></svg>',
  week:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  prep:'<svg viewBox="0 0 24 24"><path d="M5 12h14a7 7 0 0 1-7 7 7 7 0 0 1-7-7Z"/><path d="M3 21h18"/><path d="M10 8c0-1.5-1.5-1.5-1.5-3S10 2 10 2M14 8c0-1.5-1.5-1.5-1.5-3S14 2 14 2"/></svg>',
  shop:'<svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  guide:'<svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3V4Z"/><path d="M8 8h7M8 12h7"/></svg>'
};

/* ---------------------------------------------------------------- render */
function ensureWeek(){
  const wk = isoWeek(today());
  if(S.shop.week !== wk){ S.shop.week = wk; S.shop.checked = []; save(); }
}

function render(){
  const v = document.getElementById("view");
  const d = today(), tk = todayKey(), did = dayId(d);
  const slots = slotsFor(did), r = rec(tk);
  const doneCount = slots.filter(s=>r.done.includes(s.id)).length;

  document.getElementById("dayName").textContent = PLAN.days[did].name;
  const nm = nextSlot(slots, r);
  document.getElementById("daySub").textContent = tab==="today"
    ? (nm ? "Up next · "+nm.label+" at "+fmtTime(nm.time) : "Everything ticked for today")
    : d.toLocaleDateString(undefined,{day:"numeric",month:"long"});
  const arc = document.getElementById("ringArc");
  const c = 2*Math.PI*23;
  arc.setAttribute("stroke-dasharray", (c*doneCount/slots.length).toFixed(1)+" "+c.toFixed(1));
  document.getElementById("ringVal").textContent = doneCount+"/"+slots.length;

  v.innerHTML = ({ today:viewToday, week:viewWeek, prep:viewPrep,
                   shop:viewShop, guide:viewGuide })[tab]();
  renderTabs();
  window.scrollTo(0,0);
}

function nextSlot(slots, r){
  const n = nowMins();
  return slots.find(s => !r.done.includes(s.id) && !r.skip.includes(s.id) && mins(s.time) >= n-45)
      || slots.find(s => !r.done.includes(s.id) && !r.skip.includes(s.id));
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function viewToday(){
  const tk = todayKey(), did = dayId(today()), r = rec(tk);
  const slots = slotsFor(did), n = nowMins();
  let placed = false, out = "";

  for(const s of slots){
    if(!placed && mins(s.time) > n){
      out += '<div class="nowline">Now · '+esc(fmtTime(String(new Date().getHours()).padStart(2,"0")+":"+String(new Date().getMinutes()).padStart(2,"0")))+'</div>';
      placed = true;
    }
    const done = r.done.includes(s.id), skip = r.skip.includes(s.id);
    const late = !done && !skip && mins(s.time) < n;
    const cls = ["slot", done?"done":"", skip?"skip":"", open.has(s.id)?"open":"",
                 late?"late":""].filter(Boolean).join(" ");
    out += '<li class="'+cls+'">'
      + '<span class="dot">'+ICON.check+'</span>'
      + '<button class="hitdot" data-tick="'+s.id+'" aria-label="Mark '+esc(s.item)+' done"></button>'
      + '<button class="tap" data-open="'+s.id+'" aria-expanded="'+open.has(s.id)+'">'
      +   '<div class="when">'+esc(fmtTime(s.time))+' · '+esc(s.label)+'</div>'
      +   '<div class="what">'+esc(label(s))+'</div>'
      + '</button>'
      + '<div class="more">'
      +   (s.detail?'<p>'+esc(s.detail)+'</p>':'')
      +   (s.note?'<p class="flag">'+esc(s.note)+'</p>':'')
      +   (s.choice ? '<div class="chips">'+Object.entries(s.options).map(([k,vv])=>
            '<button class="chip'+(S.prefs[s.choice]===k?" on":"")+'" data-choice="'+s.choice+'" data-val="'+k+'">'+esc(vv)+'</button>').join("")+'</div>' : '')
      +   '<div class="acts">'
      +     '<button class="act'+(done?"":" solid")+'" data-tick="'+s.id+'">'+(done?"Undo":"Had it")+'</button>'
      +     '<button class="act" data-skip="'+s.id+'">'+(skip?"Unskip":"Skipped it")+'</button>'
      +   '</div>'
      + '</div></li>';
  }
  if(!placed) out += '<div class="nowline">Now · day done</div>';

  return ''
  + '<div class="strip">'
  +   '<h2>Water</h2>'
  +   '<p>2.5 litres across the day. Tap a glass as you finish it.</p>'
  +   '<div class="pips">'+Array.from({length:10},(_,i)=>
        '<button class="pip'+(i<r.water?" on":"")+'" data-water="'+(i+1)+'" aria-label="'+((i+1)*250)+' ml"></button>').join("")+'</div>'
  +   '<div class="waterline"><span>250 ml each</span><span><b>'+(r.water*0.25).toFixed(2)+'</b> of 2.5 L</span></div>'
  + '</div>'
  + '<ul class="rail">'+out+'</ul>'
  + streakBlock()
  + tonightBlock();
}

function tonightBlock(){
  const t = new Date(); t.setDate(t.getDate()+1);
  const tid = dayId(t), tasks = PLAN.prepFor[tid], k = "prep:"+dateKey(t);
  const r = rec(k);
  return '<div class="card"><h2>Tonight, for '+esc(PLAN.days[tid].name)+'</h2>'
    + '<ul class="checks">'+tasks.map((x,i)=>
        '<li><button class="'+(r.done.includes("p"+i)?"on":"")+'" data-tick2="'+k+'|p'+i+'">'
        + '<span class="box">'+ICON.check+'</span><span>'+esc(x)+'</span></button></li>').join("")
    + '</ul></div>';
}

function streakBlock(){
  const dots = [];
  let streak = 0, broken = false;
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const r = S.days[dateKey(d)];
    const total = slotsFor(dayId(d)).length;
    const n = r ? r.done.length + r.skip.length : 0;
    dots.push(n>=total-1 ? "on" : n>=Math.ceil(total*0.6) ? "half" : "");
  }
  for(let i=0;i<60;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const r = S.days[dateKey(d)];
    const total = slotsFor(dayId(d)).length;
    const n = r ? r.done.length + r.skip.length : 0;
    if(n >= Math.ceil(total*0.6)) streak++;
    else if(i===0) continue;   // today still in progress
    else break;
  }
  return '<div class="card"><div class="streak"><div class="sdots">'
    + dots.map(c=>'<span class="sdot '+c+'"></span>').join("")
    + '</div><span>'+(streak>0 ? streak+(streak===1?" day":" days")+" on track" : "Last seven days")+'</span></div></div>';
}

function viewWeek(){
  const cur = viewDay || dayId(today());
  const slots = slotsFor(cur);
  return '<div class="sechead">The week</div>'
  + '<p class="lede">Times are fixed. Only the food changes.</p>'
  + '<div class="daypick">'+PLAN.order.map(d=>
      '<button class="'+(d===cur?"on ":"")+(d===dayId(today())?"today":"")+'" data-day="'+d+'">'
      + PLAN.days[d].name.slice(0,3)+'</button>').join("")+'</div>'
  + '<div class="card"><ul class="mini">'+slots.map(s=>
      '<li><span class="t">'+esc(fmtTime(s.time))+'</span><span>'+esc(label(s))
      + '<span class="n">'+esc(s.label)+(s.detail?" · "+esc(s.detail):"")+'</span></span></li>').join("")
  + '</ul></div>';
}

function viewPrep(){
  let out = '<div class="sechead">Prep</div>'
    + '<p class="lede">Soaking is the only thing that will actually derail a day. Do it the night before.</p>';
  const t = new Date(); t.setDate(t.getDate()+1);
  const tid = dayId(t);
  out += tonightBlock();
  out += '<div class="card"><h2>Every other night</h2>';
  for(const d of PLAN.order){
    if(d===tid) continue;
    out += '<h3>Night before '+esc(PLAN.days[d].name)+'</h3><ul class="mini">'
      + PLAN.prepFor[d].map(x=>'<li><span>'+esc(x)+'</span></li>').join("") + '</ul>';
  }
  out += '</div>';
  const k = "reset:"+isoWeek(today()), r = rec(k);
  out += '<div class="card"><h2>Sunday reset</h2>'
    + '<p>Batch these once and the week gets much easier.</p><ul class="checks">'
    + PLAN.weeklyReset.map((x,i)=>
        '<li><button class="'+(r.done.includes("w"+i)?"on":"")+'" data-tick2="'+k+'|w'+i+'">'
        + '<span class="box">'+ICON.check+'</span><span>'+esc(x)+'</span></button></li>').join("")
    + '</ul></div>';
  return out;
}

function viewShop(){
  const on = new Set(S.shop.checked);
  const all = PLAN.shopping.reduce((a,g)=>a+g.items.length,0);
  return '<div class="sechead">Shopping</div>'
  + '<p class="lede">'+on.size+' of '+all+' picked up. Clears itself every Monday.</p>'
  + PLAN.shopping.map(g=>
      '<div class="card"><h2>'+esc(g.aisle)+'</h2><ul class="checks">'
      + g.items.map(it=>'<li><button class="'+(on.has(it)?"on":"")+'" data-shop="'+esc(it)+'">'
        + '<span class="box">'+ICON.check+'</span><span>'+esc(it)+'</span></button></li>').join("")
      + '</ul></div>').join("");
}

function viewGuide(){
  return '<div class="sechead">The rules</div>'
  + '<div class="card"><ul class="mini">'
  + PLAN.rules.map(x=>'<li><span>'+esc(x)+'</span></li>').join("")+'</ul></div>'
  + '<div class="card"><h2>What a bowl means</h2><table class="portions"><tbody>'
  + PLAN.portions.map(p=>'<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>').join("")
  + '</tbody></table></div>'
  + '<div class="card"><h2>Reminders on your phone</h2>'
  + '<p>This page cannot buzz your phone on its own. Import the calendar file that came '
  + 'alongside this app — it drops all 48 reminders into your phone calendar, repeating weekly, '
  + 'each one alerting ten minutes early. They fire whether or not this page is open.</p>'
  + '<p>Put them on their own calendar so you can mute the lot on a travel day.</p></div>'
  + '<div class="card"><h2>Keep it one tap away</h2>'
  + '<p>Open this site in your phone browser and use Share, then Add to Home Screen. '
  + 'It will sit there like an app and remember where you left off.</p></div>'
  + '<div class="card"><h2>Back up your record</h2>'
  + '<p>Everything you tick lives in this browser only. Clearing site data wipes it, '
  + 'and a new phone starts empty. Export a copy now and then, and keep it in your drive.</p>'
  + '<div class="acts"><button class="act solid" data-export="1">Export a backup</button>'
  + '<label class="act" for="impFile" style="cursor:pointer">Restore from file</label></div>'
  + '<input type="file" id="impFile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0">'
  + '</div>'
  + '<div class="card"><h2>A note on swaps</h2>'
  + '<p>Skipped is not the same as failed. Marking something skipped keeps your record honest, '
  + 'and the week still counts as on track if you hit most of it.</p>'
  + '<p>Anything in this app that contradicts what your dietitian told you — trust them, not the app.</p></div>'
  + '<div class="ghost">Built from your weekly plan PDF.</div>';
}

function renderTabs(){
  const T = [["today","Today"],["week","Week"],["prep","Prep"],["shop","Shop"],["guide","Guide"]];
  document.getElementById("tabs").innerHTML = T.map(([k,n])=>
    '<button class="'+(tab===k?"on":"")+'" data-tab="'+k+'">'+ICON[k]+'<span>'+n+'</span></button>').join("");
}

/* ---------------------------------------------------------------- events */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-tick],[data-tick2],[data-skip],[data-open],[data-water],[data-choice],[data-shop],[data-day]");
  if(!t) return;
  const tk = todayKey(), r = rec(tk);

  if(t.dataset.tab){ tab = t.dataset.tab; if(tab!=="week") viewDay=null; render(); return; }
  if(t.dataset.day){ viewDay = t.dataset.day; render(); return; }

  if(t.dataset.tick){
    const id = t.dataset.tick;
    const i = r.done.indexOf(id);
    if(i>=0) r.done.splice(i,1); else { r.done.push(id); const j=r.skip.indexOf(id); if(j>=0) r.skip.splice(j,1); open.delete(id); }
    save(); render(); return;
  }
  if(t.dataset.skip){
    const id = t.dataset.skip;
    const i = r.skip.indexOf(id);
    if(i>=0) r.skip.splice(i,1); else { r.skip.push(id); const j=r.done.indexOf(id); if(j>=0) r.done.splice(j,1); open.delete(id); }
    save(); render(); return;
  }
  if(t.dataset.tick2){
    const [k,id] = t.dataset.tick2.split("|");
    const rr = rec(k); const i = rr.done.indexOf(id);
    if(i>=0) rr.done.splice(i,1); else rr.done.push(id);
    save(); render(); return;
  }
  if(t.dataset.open){
    const id = t.dataset.open;
    if(open.has(id)) open.delete(id); else { open.clear(); open.add(id); }
    render(); return;
  }
  if(t.dataset.water){
    const n = Number(t.dataset.water);
    r.water = (r.water === n) ? n-1 : n;
    save(); render(); return;
  }
  if(t.dataset.choice){ S.prefs[t.dataset.choice] = t.dataset.val; save(); render(); return; }
  if(t.dataset.export){
    try{
      const blob = new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "diet-plan-backup-"+todayKey()+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(err){ alert("Could not build the backup file here."); }
    return;
  }
  if(t.dataset.shop){
    const it = t.dataset.shop, s = new Set(S.shop.checked);
    if(s.has(it)) s.delete(it); else s.add(it);
    S.shop.checked = [...s]; save(); render(); return;
  }
});

document.addEventListener("change", e=>{
  if(e.target.id !== "impFile" || !e.target.files || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const inc = JSON.parse(fr.result);
      if(!inc || typeof inc !== "object" || !inc.days) throw 0;
      S = { days: Object.assign({}, S.days, inc.days),
            shop: inc.shop || S.shop,
            prefs: Object.assign({}, S.prefs, inc.prefs || {}) };
      save(); render();
    }catch(err){ alert("That file is not a diet plan backup."); }
  };
  fr.readAsText(e.target.files[0]);
});

/* re-render on the hour so "now" stays honest; and when the tab wakes up */
setInterval(()=>{ ensureWeek(); if(tab==="today") render(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ ensureWeek(); render(); } });

/* ---------------------------------------------------------------- boot */
const cached = lsGet();
if(cached) S = Object.assign(S, cached, { prefs: Object.assign(S.prefs, cached.prefs||{}) });
ensureWeek();
render();

</script>
</body>
</html>
